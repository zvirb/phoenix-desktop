<!DOCTYPE html>

<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1754cf",
            "background-light": "#f6f6f8",
            "background-dark": "#111621",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
  <style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-white min-h-screen flex flex-col font-display">
  <div
    class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
    <!-- TopAppBar -->
    <div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
      <div class="text-slate-800 dark:text-white flex size-12 shrink-0 items-center justify-start">
        <span class="material-symbols-outlined text-[24px]">close</span>
      </div>
      <h2
        class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">
        Setup Device</h2>
    </div>
    <!-- Progress Indicator -->
    <div class="flex w-full flex-row items-center justify-center gap-3 py-5">
      <div class="h-2 w-2 rounded-full bg-primary"></div>
      <div class="h-2 w-8 rounded-full bg-primary"></div>
      <div class="h-2 w-2 rounded-full bg-slate-300 dark:bg-[#3c4453]"></div>
    </div>
    <!-- HeadlineText -->
    <div class="px-4">
      <h3 class="text-slate-900 dark:text-white tracking-light text-2xl font-bold leading-tight text-center pb-2 pt-5">
        Handshake Protocol</h3>
      <!-- BodyText -->
      <p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal pb-3 pt-1 text-center">
        Configure your Phoenix agent to synchronize with your local intelligence core.
      </p>
    </div>
    <div class="flex flex-col gap-2 px-4 py-4 mt-2">
      <!-- TextField 1: Device Name -->
      <div class="flex flex-wrap items-end gap-4 py-2">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-slate-900 dark:text-white text-sm font-medium leading-normal pb-2">Device Name</p>
          <div class="relative">
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border border-slate-300 dark:border-[#3c4453] bg-white dark:bg-[#1c1f26] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b8] p-[15px] text-base font-normal leading-normal"
              placeholder="e.g., Main-Workstation" value="Main-Workstation" />
          </div>
        </label>
      </div>
      <!-- TextField 2: Phoenix Core URL -->
      <div class="flex flex-wrap items-end gap-4 py-2">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-slate-900 dark:text-white text-sm font-medium leading-normal pb-2">Phoenix Core URL</p>
          <div class="relative">
            <input id="input-core-url"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border border-slate-300 dark:border-[#3c4453] bg-white dark:bg-[#1c1f26] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b8] p-[15px] text-base font-normal leading-normal"
              placeholder="http://phoenix-core.local" value="http://localhost:8000" />
          </div>
        </label>
      </div>
      <!-- TextField 3: Device Token -->
      <div class="flex flex-wrap items-end gap-4 py-2">
        <label class="flex flex-col min-w-40 flex-1">
          <p class="text-slate-900 dark:text-white text-sm font-medium leading-normal pb-2">Device Token</p>
          <div class="relative">
            <input id="input-device-token"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-slate-900 dark:text-white focus:outline-0 focus:ring-0 border border-slate-300 dark:border-[#3c4453] bg-white dark:bg-[#1c1f26] focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-[#9da6b8] p-[15px] text-base font-normal leading-normal"
              placeholder="px_token_..." type="password" value="" />
          </div>
        </label>
      </div>
    </div>
    <!-- Connection Test Status Bar (Error State) -->
    <div class="mx-4 mt-6">
      <div class="flex items-center justify-between p-4 bg-red-500/10 border border-red-500/30 rounded-xl">
        <div class="flex items-center gap-3">
          <span class="material-symbols-outlined text-red-500">error</span>
          <div>
            <p class="text-red-500 text-sm font-bold">Server Unreachable</p>
            <p class="text-red-400 text-xs">Check URL and network connection</p>
          </div>
        </div>
        <button
          class="flex items-center justify-center bg-red-500 text-white rounded-lg px-3 py-1.5 text-xs font-bold transition hover:bg-red-600">
          <span class="material-symbols-outlined text-sm mr-1">refresh</span>
          Retry
        </button>
      </div>
    </div>
    <!-- Footer Actions -->
    <div class="mt-auto p-4 pb-10">
      <button id="btn-connect"
        class="w-full bg-primary hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-colors duration-200">
        Data Link Start
      </button>
      <p class="text-center text-slate-500 dark:text-slate-500 text-xs mt-4">
        By connecting, you agree to the Phoenix Data Governance Policy.
      </p>
    </div>
  </div>
  </div>
  <script src="../phoenix-loader.js"></script>
  <script>
    document.getElementById('btn-connect').addEventListener('click', async () => {
      const token = document.getElementById('input-device-token').value;
      const coreUrl = document.getElementById('input-core-url').value;
      const btn = document.getElementById('btn-connect');

      if (!token) {
        alert("Please enter a device token");
        return;
      }

      // Save Core URL
      if (coreUrl) {
        localStorage.setItem('phoenix_core_url', coreUrl.replace(/\/$/, "")); // remove trailing slash
      }

      btn.innerText = "Authenticating...";

      try {
        localStorage.setItem('phoenix_device_id', token);

        // Use dynamic URL
        const baseUrl = localStorage.getItem('phoenix_core_url') || 'http://localhost:8000';

        const response = await fetch(`${baseUrl}/api/v1/devices/authenticate`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('phoenix_access_token', data.access_token);
          btn.innerText = "Connected!";
          btn.classList.add('bg-green-600');
          setTimeout(() => {
            // Bridge to Desktop App
            console.log("PHOENIX_ONBOARDING_SAVE:" + JSON.stringify({
              token: data.access_token,
              device_token: token,
              core_url: localStorage.getItem('phoenix_core_url')
            }));
            alert("Device Authenticated Successfully!");
          }, 500);
        } else {
          btn.innerText = "Connection Failed";
          btn.classList.add('bg-red-600');
        }
      } catch (e) {
        console.error(e);
        btn.innerText = "Error";
      }
    });
  </script>
</body>

</html>
