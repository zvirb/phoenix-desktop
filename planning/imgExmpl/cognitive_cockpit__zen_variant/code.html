<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Phoenix - Deep Dive Intelligence</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4A90E2", /* Soft slate blue for accents */
                        "background-light": "#f6f6f8",
                        "background-dark": "#111621", /* Deep charcoal */
                        "surface-dark": "#1c2230", /* Slightly lighter charcoal for cards */
                        "zen-accent": "#64748b", /* Slate */
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        /* Custom pulse for the zen circle */
        @keyframes zen-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(100, 116, 139, 0.4);
            }

            70% {
                box-shadow: 0 0 0 40px rgba(100, 116, 139, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(100, 116, 139, 0);
            }
        }

        .zen-circle {
            animation: zen-pulse 3s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-x-hidden">
    <!-- Top App Bar -->
    <header
        class="flex items-center justify-between p-4 pb-2 sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
        <button
            class="flex size-12 shrink-0 items-center justify-center text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors rounded-full">
            <span class="material-symbols-outlined text-2xl">menu</span>
        </button>
        <h2
            class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center opacity-90">
            Deep Dive</h2>
        <button
            class="flex size-12 shrink-0 items-center justify-center text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors rounded-full">
            <span class="material-symbols-outlined text-2xl">settings</span>
        </button>
    </header>
    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative px-4 pt-6 pb-24">
        <!-- Status Indicator -->
        <div class="flex flex-col items-center justify-center mb-12 animate-fade-in">
            <span id="status-text"
                class="px-4 py-1.5 rounded-full bg-surface-dark/50 border border-slate-700/30 text-xs font-medium text-zen-accent uppercase tracking-widest">
                Ready for Input
            </span>
        </div>
        <!-- Central Visualization (Zen Circle) -->
        <div class="flex-1 flex flex-col items-center justify-center min-h-[300px]">
            <!-- The glowing orb/button container -->
            <div class="relative group cursor-pointer">
                <!-- Outer glow rings -->
                <div
                    class="absolute inset-0 bg-primary/20 rounded-full blur-3xl opacity-20 group-hover:opacity-40 transition-opacity duration-700">
                </div>
                <!-- Main button circle -->
                <button
                    class="zen-circle relative flex items-center justify-center w-48 h-48 rounded-full bg-gradient-to-br from-surface-dark to-background-dark border border-slate-700/50 shadow-2xl transition-transform duration-300 active:scale-95 group-hover:border-primary/30">
                    <div class="flex flex-col items-center gap-2">
                        <span
                            class="material-symbols-outlined text-5xl text-slate-300 group-hover:text-primary transition-colors duration-300">graphic_eq</span>
                        <span
                            class="text-sm font-medium text-slate-500 group-hover:text-slate-300 transition-colors">Tap
                            to Speak</span>
                    </div>
                </button>
            </div>
            <h3
                class="mt-12 text-slate-400 dark:text-slate-500 tracking-wide text-xl font-light leading-tight text-center">
                I'm listening. Focus on your query.
            </h3>
        </div>
        <!-- Output Adaptation Modes -->
        <div class="mt-auto pt-10">
            <div class="flex justify-center items-center gap-6 mb-8">
                <!-- Mode 1: Visual -->
                <button class="flex flex-col items-center gap-2 group p-2">
                    <div
                        class="size-14 rounded-2xl bg-surface-dark border border-slate-800 flex items-center justify-center group-hover:border-slate-600 group-hover:bg-slate-800 transition-all shadow-lg">
                        <span class="material-symbols-outlined text-slate-400 group-hover:text-white">visibility</span>
                    </div>
                    <span class="text-xs font-medium text-slate-500 group-hover:text-slate-300">Visual</span>
                </button>
                <!-- Mode 2: Concise (Active) -->
                <button class="flex flex-col items-center gap-2 group p-2">
                    <div
                        class="size-14 rounded-2xl bg-slate-700 border border-slate-600 flex items-center justify-center shadow-lg ring-2 ring-primary/20">
                        <span class="material-symbols-outlined text-white">short_text</span>
                    </div>
                    <span class="text-xs font-medium text-white">Concise</span>
                </button>
                <!-- Mode 3: Step-by-Step -->
                <button class="flex flex-col items-center gap-2 group p-2">
                    <div
                        class="size-14 rounded-2xl bg-surface-dark border border-slate-800 flex items-center justify-center group-hover:border-slate-600 group-hover:bg-slate-800 transition-all shadow-lg">
                        <span
                            class="material-symbols-outlined text-slate-400 group-hover:text-white">format_list_numbered</span>
                    </div>
                    <span class="text-xs font-medium text-slate-500 group-hover:text-slate-300">Step-by-Step</span>
                </button>
            </div>
        </div>
    </main>
    <!-- Bottom Sheet / Model Selection Handle -->
    <div
        class="fixed bottom-0 left-0 right-0 bg-surface-dark rounded-t-[2rem] border-t border-slate-700/50 p-6 pb-8 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] z-40 transform transition-transform hover:-translate-y-2 cursor-pointer group">
        <!-- Drag Handle -->
        <div class="w-12 h-1.5 bg-slate-600 rounded-full mx-auto mb-6 group-hover:bg-slate-500 transition-colors"></div>
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div
                    class="size-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-xs shadow-inner">
                    PHX
                </div>
                <div>
                    <h4 class="text-white font-semibold text-sm">Phoenix Core 4.0</h4>
                    <p class="text-slate-400 text-xs">Standard Reasoning Model</p>
                </div>
            </div>
            <button
                class="size-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                <span class="material-symbols-outlined">expand_less</span>
            </button>
        </div>
    </div>
    </div>
    <script src="../phoenix-loader.js"></script>
    <script>
        async function loadZenData() {
            const lat = await window.phoenixAPI.checkLatency();
            if (lat < 1000) {
                window.updateElement('status-text', `Connected (${lat}ms)`);
            } else {
                window.updateElement('status-text', `Offline`);
            }
        }
        loadZenData();
        setInterval(loadZenData, 5000);
    </script>
</body>

</html>
